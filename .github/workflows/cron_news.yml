name: Tägliches KI News Update

on:
schedule:
    # 06:00 UTC ist 08:00 Uhr deutsche Sommerzeit (Puffer für 09:00 Uhr)
    # 19:00 UTC ist 21:00 Uhr deutsche Sommerzeit (Puffer für 22:00 Uhr)
    - cron: '0 6,19 * * *'
  workflow_dispatch: # Ermöglicht es uns, den Roboter manuell zu testen!

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Werkzeuge installieren
      run: pip install requests

    - name: Skript ausführen und KI fragen
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python update_news.py

    - name: Änderungen auf GitHub hochladen
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add news.json
        git diff-index --quiet HEAD || git commit -m "KI Morning/Evening Brief aktualisiert"
        git push
